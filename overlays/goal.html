<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { height: 100vh; }
      canvas { position: fixed; inset: 0; pointer-events: none; }
      .goal { position: absolute; left: 20px; top: 20px; width: min(calc(100vw - 52px), 756px); padding: 16px 22px 20px; border-radius: 6px; box-shadow: 8px 8px 0 var(--teal); }
      .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
      .label { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; color: var(--ink); }
      .label img { width: 46px; height: 46px; border-radius: 4px; }
      .count { font-weight: 800; font-stretch: 72%; font-size: 48px; line-height: 0.9; color: var(--ink); }
      .count small { font-size: 0.55em; }
      .bar { position: relative; height: 30px; margin-top: 14px; border-radius: 4px; background: var(--ink); overflow: hidden; }
      .fill { position: absolute; inset: 4px auto 4px 4px; width: 0; border-radius: 2px; background: var(--accent); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }
      .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(28, 26, 23, 0.22) 0 10px, transparent 10px 20px); }
            .pct { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 800; color: var(--fang); z-index: 2; }
            .done .goal { box-shadow: 8px 8px 0 var(--accent); }
      .done .label span::after { content: ", done!"; }
          </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="goal paper">
      <div class="head">
        <div class="label"><img src="/logo.png" alt="" /><span id="label">Goal</span></div>
        <div class="count"><span id="current">0</span> <small>/ <span id="target">0</span></small></div>
      </div>
      <div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
    </div>
    <script src="kit.js"></script>
    <script>
      let shown = null;
      let wasDone = null;
      function countTo(el, to) {
        const from = Number(el.dataset.v || 0);
        const start = performance.now();
        const step = (t) => {
          const k = Math.min(1, (t - start) / 900);
          const v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
          el.textContent = v.toLocaleString();
          if (k < 1) requestAnimationFrame(step);
        };
        el.dataset.v = to;
        requestAnimationFrame(step);
      }
      Mad.connect((message) => {
        if (message.type !== 'state' || !message.goal) return;
        const goal = message.goal;
        const current = Number(goal.current) || 0;
        const target = Number(goal.target) || 1;
        const pct = Math.max(0, Math.min(100, Math.round((current / target) * 100)));
        document.getElementById('label').textContent = goal.label;
        document.getElementById('target').textContent = target.toLocaleString();
        document.getElementById('pct').textContent = `${pct}%`;
        document.getElementById('fill').style.width = `${Math.max(pct, 3)}%`;
        if (shown !== current) countTo(document.getElementById('current'), current);
        shown = current;
        const done = current >= target;
        document.body.classList.toggle('done', done);
        if (done && wasDone === false) {
          const css = getComputedStyle(document.documentElement);
          Mad.burst(document.getElementById('fx'), 400, 80, [css.getPropertyValue('--accent').trim(), css.getPropertyValue('--accent2').trim(), '#1c1a17'], 140);
          Mad.chime();
        }
        wasDone = done;
      });
    </script>
  </body>
</html>
