<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { height: 100vh; }
      canvas { position: fixed; inset: 0; pointer-events: none; }
      .goal { position: absolute; left: 24px; top: 24px; width: min(calc(100vw - 48px), 760px); padding: 20px 24px 22px; border-radius: 22px; background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); }
      .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
      .label { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent2); }
      .label img { width: 40px; height: 40px; border-radius: 10px; }
      .count { font-family: var(--display); font-size: 46px; line-height: 0.9; letter-spacing: 0.01em; }
      .count small { font-size: 0.55em; color: rgba(255, 255, 255, 0.5); }
      .bar { position: relative; height: 26px; margin-top: 16px; border-radius: 99px; background: rgba(0, 0, 0, 0.5); box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6); overflow: hidden; }
      .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent)); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }
      .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.18) 0 14px, transparent 14px 28px); background-size: 200% 100%; animation: stripes 1.6s linear infinite; }
      .fill::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7)); border-radius: 99px; }
      .pct { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 3px #000; z-index: 2; }
      @keyframes stripes { to { background-position: -56px 0; } }
      .done .goal { border-color: var(--accent2); animation: glow 1.6s ease-in-out infinite; }
      .done .label span::after { content: " · reached!"; color: #fff; }
      @keyframes glow { 50% { box-shadow: 0 0 50px color-mix(in srgb, var(--accent2) 60%, transparent); } }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="goal">
      <div class="head">
        <div class="label"><img src="/logo.png" alt="" /><span id="label">Goal</span></div>
        <div class="count"><span id="current">0</span> <small>/ <span id="target">0</span></small></div>
      </div>
      <div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
    </div>
    <script src="kit.js"></script>
    <script>
      let shown = null;
      let wasDone = null;
      function countTo(el, to) {
        const from = Number(el.dataset.v || 0);
        const start = performance.now();
        const step = (t) => {
          const k = Math.min(1, (t - start) / 900);
          const v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
          el.textContent = v.toLocaleString();
          if (k < 1) requestAnimationFrame(step);
        };
        el.dataset.v = to;
        requestAnimationFrame(step);
      }
      Mad.connect((message) => {
        if (message.type !== 'state' || !message.goal) return;
        const goal = message.goal;
        const current = Number(goal.current) || 0;
        const target = Number(goal.target) || 1;
        const pct = Math.max(0, Math.min(100, Math.round((current / target) * 100)));
        document.getElementById('label').textContent = goal.label;
        document.getElementById('target').textContent = target.toLocaleString();
        document.getElementById('pct').textContent = `${pct}%`;
        document.getElementById('fill').style.width = `${Math.max(pct, 3)}%`;
        if (shown !== current) countTo(document.getElementById('current'), current);
        shown = current;
        const done = current >= target;
        document.body.classList.toggle('done', done);
        if (done && wasDone === false) {
          const css = getComputedStyle(document.documentElement);
          Mad.burst(document.getElementById('fx'), 400, 80, [css.getPropertyValue('--accent').trim(), css.getPropertyValue('--accent2').trim(), '#fff'], 140);
          Mad.chime();
        }
        wasDone = done;
      });
    </script>
  </body>
</html>
