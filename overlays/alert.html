<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { width: 100vw; height: 100vh; }
      canvas { position: fixed; inset: 0; pointer-events: none; }
      .wrap { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); width: max-content; max-width: 1800px; display: flex; flex-direction: column; align-items: center; --c: var(--accent); }
      .badge { position: relative; z-index: 2; width: 150px; height: 150px; border-radius: 8px; box-shadow: 8px 8px 0 var(--c); opacity: 0; transform: translateY(-60px) rotate(-8deg); }
      .badge img { width: 100%; height: 100%; display: block; border-radius: 8px; }
      /* Mustard print with an offset in the alert's own color, like the logo's misregistered outline. */
      .card { position: relative; margin-top: -30px; min-width: 760px; padding: 56px 70px 34px; border-radius: 8px; text-align: center; box-shadow: 14px 14px 0 var(--c), 14px 14px 0 3px var(--ink); opacity: 0; transform: scale(1.25); }
      .kind { display: inline-block; font-family: var(--ui); font-weight: 800; font-stretch: 80%; font-size: 30px; color: var(--c); background: var(--ink); padding: 4px 20px 6px; border-radius: 4px; }
      h1 { margin: 14px 0 0; font-family: var(--display); font-weight: 900; font-size: 130px; line-height: 0.85; color: var(--ink); white-space: nowrap; }
      p { margin: 14px 0 0; font-size: 36px; font-weight: 600; color: var(--ink); }
      .timer { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: var(--ink); transform-origin: left; border-radius: 0 0 0 8px; }
      /* One orchestrated entrance: the card is struck onto the screen like a print. */
      .on .badge { animation: drop 0.5s 0.25s cubic-bezier(.3, 1.5, .5, 1) forwards; }
      .on .card { animation: strike 0.32s cubic-bezier(.5, 0, .7, 1) forwards; }
      .on .timer { animation: timer var(--dur) linear forwards; }
      .on h1 .ch { display: inline-block; animation: pop 0.4s cubic-bezier(.2, 1.6, .4, 1) both; }
      .off .badge, .off .card { opacity: 1; transform: none; animation: out 0.35s ease-in forwards; }
      @keyframes drop { to { opacity: 1; transform: rotate(-4deg); } }
      @keyframes strike { 70% { opacity: 1; transform: scale(0.97); } to { opacity: 1; transform: none; } }
      @keyframes out { to { opacity: 0; transform: translateY(30px); } }
      @keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      @keyframes pop { from { opacity: 0; transform: translateY(30px); } }
      .idle { position: absolute; inset: 0; display: none; place-items: center; font-size: 34px; font-weight: 600; color: rgba(255, 255, 255, 0.25); }
      .preview .idle.show { display: grid; }
      @media (prefers-reduced-motion: reduce) { .on .badge, .on .card, .on h1 .ch { animation-duration: 1ms; } }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="idle" id="idle">Waiting for an alert</div>
    <div class="wrap" id="wrap">
      <div class="badge"><img src="/logo.png" alt="" /></div>
      <div class="card paper">
        <div class="kind" id="kind"></div>
        <h1 id="title"></h1>
        <p id="detail"></p>
        <div class="timer"></div>
      </div>
    </div>
    <script src="kit.js"></script>
    <script>
      const LABELS = { follow: 'New follower', sub: 'New subscriber', raid: 'Raid incoming', host: 'Hosted', kick: 'Kicks', tip: 'Tip' };
      const wrap = document.getElementById('wrap');
      const idle = document.getElementById('idle');
      const fx = document.getElementById('fx');
      if (Mad.preview) { document.body.classList.add('preview'); idle.classList.add('show'); }
      let timer;
      let outTimer;

      function titleHtml(title, name) {
        const safe = Mad.esc(title);
        if (!name || !title.includes(name)) return safe;
        const letters = [...name].map((ch, i) => `<span class="ch" style="animation-delay:${0.35 + i * 0.035}s">${Mad.esc(ch)}</span>`).join('');
        return safe.replace(Mad.esc(name), `<span class="name">${letters}</span>`);
      }

      function show(alert) {
        const color = alert.color || getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        const dur = Math.max(2500, alert.duration || 6000);
        wrap.style.setProperty('--c', color);
        wrap.style.setProperty('--dur', `${dur - 500}ms`);
        document.getElementById('kind').textContent = LABELS[alert.kind] || alert.kind || 'Alert';
        document.getElementById('title').innerHTML = titleHtml(alert.title || '', alert.name || '');
        document.getElementById('detail').textContent = alert.detail || '';
        idle.classList.remove('show');
        wrap.className = 'wrap';
        void wrap.offsetWidth;
        wrap.className = 'wrap on';
        Mad.chime();
        setTimeout(() => Mad.burst(fx, innerWidth / 2, innerHeight * 0.3, [color, getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim(), '#1c1a17'], alert.kind === 'raid' || alert.kind === 'sub' ? 160 : 90), 350);
        clearTimeout(timer); clearTimeout(outTimer);
        timer = setTimeout(() => {
          wrap.className = 'wrap off';
          outTimer = setTimeout(() => { wrap.className = 'wrap'; if (Mad.preview) idle.classList.add('show'); }, 450);
        }, dur - 450);
      }

      Mad.connect((message) => { if (message.type === 'alert') show(message.alert); });
    </script>
  </body>
</html>
