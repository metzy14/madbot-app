<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { width: 100vw; height: 100vh; }
      .scene { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; background: #0b0a08; opacity: 0; transition: opacity 0.8s ease; }
      .scene.on { opacity: 1; }
      .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.55; }
      .b1 { width: 1100px; height: 1100px; left: -300px; top: -400px; background: var(--accent2); animation: float 18s ease-in-out infinite alternate; }
      .b2 { width: 1200px; height: 1200px; right: -400px; bottom: -500px; background: var(--accent); animation: float 22s ease-in-out infinite alternate-reverse; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(circle at 50% 50%, #000, transparent 75%); }
      .grain { position: absolute; inset: 0; opacity: 0.12; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
      @keyframes float { to { transform: translate(200px, 140px) scale(1.15); } }
      .content { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; }
      .logo { position: relative; width: 300px; height: 300px; }
      .logo img { position: relative; width: 100%; height: 100%; border-radius: 64px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6); z-index: 1; }
      .logo .r { position: absolute; inset: -22px; border-radius: 80px; border: 4px solid var(--accent); opacity: 0; animation: ripple 3s ease-out infinite; }
      .logo .r:nth-child(2) { animation-delay: 1s; border-color: var(--accent2); }
      .logo .r:nth-child(3) { animation-delay: 2s; }
      @keyframes ripple { from { opacity: 0.8; transform: scale(0.95); } to { opacity: 0; transform: scale(1.5); } }
      h1 { margin: 60px 0 0; font-family: var(--display); font-weight: 400; font-size: 150px; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; background: linear-gradient(180deg, #fff 40%, #d4c8ae); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5)); }
      p { margin: 18px 0 0; font-size: 38px; font-weight: 500; color: rgba(255, 248, 232, 0.8); max-width: 1300px; }
      .clock { margin-top: 40px; display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 64px; font-weight: 600; padding: 14px 36px; border-radius: 22px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.1); }
      .clock[hidden] { display: none; }
      .clock .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px var(--accent); animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.2; } }
      .foot { position: absolute; left: 0; right: 0; bottom: 50px; display: flex; justify-content: center; gap: 40px; font-size: 26px; font-weight: 600; color: rgba(255, 255, 255, 0.6); letter-spacing: 0.08em; }
      .foot b { color: var(--accent2); }
      .on .content > * { animation: rise 0.9s cubic-bezier(.2, .9, .2, 1) both; }
      .on .content > *:nth-child(2) { animation-delay: 0.12s; }
      .on .content > *:nth-child(3) { animation-delay: 0.24s; }
      .on .content > *:nth-child(4) { animation-delay: 0.36s; }
      @keyframes rise { from { opacity: 0; transform: translateY(50px); } }
      .idle { position: absolute; inset: 0; display: none; place-items: center; font-size: 34px; letter-spacing: 0.3em; color: rgba(255, 255, 255, 0.18); text-transform: uppercase; }
      .preview .idle.show { display: grid; }
    </style>
  </head>
  <body>
    <div class="idle" id="idle">Scene hidden</div>
    <div class="scene" id="scene">
      <div class="blob b1"></div><div class="blob b2"></div><div class="grid"></div><div class="grain"></div>
      <div class="content">
        <div class="logo"><div class="r"></div><div class="r"></div><div class="r"></div><img src="/logo.png" alt="" /></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <div class="clock" id="clock"><span class="dot"></span><span id="time">00:00</span></div>
      </div>
      <div class="foot"><span id="channel"></span><span id="latest"></span></div>
    </div>
    <script src="kit.js"></script>
    <script>
      const sceneEl = document.getElementById('scene');
      const idle = document.getElementById('idle');
      if (Mad.preview) document.body.classList.add('preview');
      let endsAt = 0;
      let mode = 'off';
      function tick() {
        const clock = document.getElementById('clock');
        if (!endsAt) { clock.hidden = true; return; }
        clock.hidden = false;
        const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
        document.getElementById('time').textContent = left ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}` : (mode === 'ending' ? 'BYE!' : 'ANY SEC');
      }
      setInterval(tick, 250);
      Mad.connect((message) => {
        if (message.type !== 'state') return;
        const scene = message.scene || { mode: 'off' };
        const on = scene.mode && scene.mode !== 'off';
        if (on && (!sceneEl.classList.contains('on') || scene.mode !== mode)) {
          sceneEl.classList.remove('on');
          void sceneEl.offsetWidth;
          sceneEl.classList.add('on');
        }
        if (!on) sceneEl.classList.remove('on');
        idle.classList.toggle('show', !on);
        mode = scene.mode;
        endsAt = scene.endsAt || 0;
        document.getElementById('title').textContent = scene.title || '';
        document.getElementById('subtitle').textContent = scene.subtitle || '';
        document.getElementById('channel').innerHTML = `kick.com/<b>${Mad.esc(message.channel || '')}</b>`;
        const latest = (message.events || [])[0];
        document.getElementById('latest').textContent = latest ? `Latest: ${latest.text}` : '';
        tick();
      });
    </script>
  </body>
</html>
