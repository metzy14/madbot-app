<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { width: 100vw; height: 100vh; }
      .scene { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; opacity: 0; transition: opacity 0.6s ease; }
      .scene.on { opacity: 1; }
            .content { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; }
      .logo { position: relative; width: 300px; height: 300px; }
      .logo img { position: relative; width: 100%; height: 100%; border-radius: 10px; box-shadow: 14px 14px 0 var(--teal); z-index: 1; }
                              h1 { margin: 56px 0 0; font-family: var(--display); font-weight: 900; font-size: 220px; line-height: 0.95; color: var(--ink); text-shadow: 10px 8px 0 var(--teal); }
      p { margin: 54px 0 0; font-size: 40px; font-weight: 600; color: var(--ink); max-width: 1300px; }
      .clock { margin-top: 44px; display: flex; gap: 16px; align-items: center; font-weight: 800; font-stretch: 72%; font-size: 92px; line-height: 1; padding: 10px 34px 14px; border-radius: 6px; background: var(--ink); color: var(--fang); box-shadow: 10px 10px 0 var(--teal); }
      .clock[hidden] { display: none; }
      .clock .dot { width: 20px; height: 20px; border-radius: 50%; background: #e5432f; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.2; } }
      .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 60px; display: flex; justify-content: space-between; gap: 40px; font-size: 30px; font-weight: 700; background: var(--ink); color: var(--fang); }
      .foot b { color: var(--accent2); font-weight: 800; }
      .on .content > * { animation: rise 0.7s cubic-bezier(.2, .9, .2, 1) both; }
      .on .content > *:nth-child(2) { animation-delay: 0.12s; }
      .on .content > *:nth-child(3) { animation-delay: 0.24s; }
      .on .content > *:nth-child(4) { animation-delay: 0.36s; }
      @keyframes rise { from { opacity: 0; transform: translateY(50px); } }
      .idle { position: absolute; inset: 0; display: none; place-items: center; font-size: 34px; font-weight: 600; color: rgba(255, 255, 255, 0.25); }
      .preview .idle.show { display: grid; }
    </style>
  </head>
  <body>
    <div class="idle" id="idle">Scene hidden</div>
    <div class="scene paper" id="scene">
      <div class="content">
        <div class="logo"><img src="/logo.png" alt="" /></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <div class="clock" id="clock"><span class="dot"></span><span id="time">00:00</span></div>
      </div>
      <div class="foot"><span id="channel"></span><span id="latest"></span></div>
    </div>
    <script src="kit.js"></script>
    <script>
      const sceneEl = document.getElementById('scene');
      const idle = document.getElementById('idle');
      if (Mad.preview) document.body.classList.add('preview');
      let endsAt = 0;
      let mode = 'off';
      function tick() {
        const clock = document.getElementById('clock');
        if (!endsAt) { clock.hidden = true; return; }
        clock.hidden = false;
        const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
        document.getElementById('time').textContent = left ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}` : (mode === 'ending' ? 'BYE!' : 'ANY SEC');
      }
      setInterval(tick, 250);
      Mad.connect((message) => {
        if (message.type !== 'state') return;
        const scene = message.scene || { mode: 'off' };
        const on = scene.mode && scene.mode !== 'off';
        if (on && (!sceneEl.classList.contains('on') || scene.mode !== mode)) {
          sceneEl.classList.remove('on');
          void sceneEl.offsetWidth;
          sceneEl.classList.add('on');
        }
        if (!on) sceneEl.classList.remove('on');
        idle.classList.toggle('show', !on);
        mode = scene.mode;
        endsAt = scene.endsAt || 0;
        document.getElementById('title').textContent = scene.title || '';
        document.getElementById('subtitle').textContent = scene.subtitle || '';
        document.getElementById('channel').innerHTML = `kick.com/<b>${Mad.esc(message.channel || '')}</b>`;
        const latest = (message.events || [])[0];
        document.getElementById('latest').textContent = latest ? `Latest: ${latest.text}` : '';
        tick();
      });
    </script>
  </body>
</html>
