<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: flex; align-items: stretch; background: var(--ink); border-top: 6px solid var(--teal); overflow: hidden; }
      .tag { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 0 26px 0 12px; font-family: var(--display); font-weight: 900; font-size: 42px; }
      .tag img { width: 54px; height: 54px; border-radius: 4px; }
      .track { flex: 1; position: relative; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
      .run { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; will-change: transform; animation: run var(--speed, 40s) linear infinite; }
      .item { display: inline-flex; align-items: center; gap: 12px; padding: 0 30px; font-size: 28px; font-weight: 600; }
      .item b { color: var(--c, var(--accent)); font-weight: 700; }
      .item .sep { width: 12px; height: 12px; background: var(--accent2); margin-left: 30px; }
      .goal { display: flex; align-items: center; gap: 14px; padding: 0 26px; font-weight: 800; font-stretch: 80%; font-size: 28px; }
      .goal .mini { width: 160px; height: 14px; border-radius: 2px; background: #3a372f; overflow: hidden; }
      .goal .mini span { display: block; height: 100%; background: var(--accent); }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="tag paper"><img src="/logo.png" alt="" />Latest</div>
      <div class="track"><div class="run" id="run"></div></div>
      <div class="goal"><span id="goal"></span><div class="mini"><span id="mini"></span></div></div>
    </div>
    <script src="kit.js"></script>
    <script>
      const run = document.getElementById('run');
      let last = '';
      Mad.connect((message) => {
        if (message.type !== 'state') return;
        const events = (message.events || []).slice(0, 10);
        const items = events.length
          ? events.map((item) => `<span class="item" style="--c:${Mad.esc(item.color || '')}">${Mad.esc(item.text)}<i class="sep"></i></span>`).join('')
          : `<span class="item">Welcome to the kennel<i class="sep"></i></span><span class="item">kick.com/${Mad.esc(message.channel || '')}<i class="sep"></i></span>`;
        if (items !== last) {
          last = items;
          run.innerHTML = items + items;
          run.style.setProperty('--speed', `${Math.max(18, events.length * 6)}s`);
        }
        const goal = message.goal || {};
        const pct = Math.max(0, Math.min(100, Math.round(((goal.current || 0) / (goal.target || 1)) * 100)));
        document.getElementById('goal').textContent = `${goal.label || 'Goal'} ${goal.current ?? 0}/${goal.target ?? 0}`;
        document.getElementById('mini').style.width = `${pct}%`;
      });
    </script>
  </body>
</html>
