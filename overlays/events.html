<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      ul { list-style: none; margin: 0; padding: 18px; width: min(100vw, 520px); display: flex; flex-direction: column; gap: 10px; }
      li { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 4px; background: var(--ink-2); border-left: 8px solid var(--c); box-shadow: 4px 4px 0 var(--teal); }
      li.new { animation: in 0.55s cubic-bezier(.2, 1.3, .4, 1) both; }
      li:nth-child(n+2) { opacity: 0.92; }
      li:nth-child(n+4) { opacity: 0.75; }
      li:nth-child(n+6) { opacity: 0.55; }
      .ico { width: 42px; height: 42px; flex: none; border-radius: 3px; display: grid; place-items: center; background: var(--ink); color: var(--c); }
      .ico svg { width: 22px; height: 22px; }
      .t { font-size: 22px; font-weight: 700; line-height: 1.15; }
      .k { font-size: 15px; font-weight: 700; color: var(--c); }
      @keyframes in { from { opacity: 0; transform: translateX(-30px); } }
    </style>
  </head>
  <body>
    <ul id="list"></ul>
    <script src="kit.js"></script>
    <script>
      const ICON = {
        follow: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
        sub: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
        raid: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
        host: '<rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/>',
        kick: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
        tip: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
      };
      const LABEL = { follow: 'Follow', sub: 'Sub', raid: 'Raid', host: 'Host', kick: 'Kicks', tip: 'Tip' };
      const list = document.getElementById('list');
      const seen = new Set();
      let first = true;
      Mad.connect((message) => {
        if (message.type !== 'state') return;
        list.innerHTML = (message.events || []).slice(0, 6).map((item, i) => {
          const k = `${item.at}|${item.text}`;
          const isNew = !seen.has(k);
          seen.add(k);
          const svg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[item.kind] || ICON.kick}</svg>`;
          return `<li class="${isNew ? 'new' : ''}" style="--c:${Mad.esc(item.color || 'var(--accent)')};animation-delay:${first ? i * 80 : 0}ms"><div class="ico">${svg}</div><div><div class="k">${Mad.esc(LABEL[item.kind] || 'Event')}</div><div class="t">${Mad.esc(item.text)}</div></div></li>`;
        }).join('');
        first = false;
      });
    </script>
  </body>
</html>
